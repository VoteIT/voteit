[project]
name = "voteit"
version = "0.1.dev"
description = "Decisions online or in general assemblies, realtime or async"
authors = [
    {name = "VoteIT dev team", email = "info@voteit.se"}
]
license = {text = "AGPL"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels-envelope (>=1.1.0,<2.0.0)",
    "python3-vote-core (>=20170329.0,<20170330.0)",
    "stvpoll (>=0.4.6,<0.5.0)",
    "rules (>=3.5,<4.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic[email] (<2)",
    "rq (>=2.6.0,<3.0.0)",
    "django-auditlog (>=3.3.0,<4.0.0)",
    "django-rq (>=3.1,<4.0)",
    "django-fsm-admin-django-4 (>=1.2.7,<2.0.0)",
    "django-fsm (<3)",
    "django-filter (>=25.2,<26.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django (>=5.2.7,<6.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "channels (>=4.3.1,<5.0.0)",
    "psycopg[binary,pool] (>=3.2.12,<4.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "nh3 (>=0.3.1,<0.4.0)",
    "pymemcache (>=4.0.0,<5.0.0)",
    "social-auth-app-django (>=5.6.0,<6.0.0)",
    "django-sql-utils (>=0.7.0,<0.8.0)",
    "rq-scheduler (>=0.14.0,<0.15.0)",
]

[project.urls]
Homepage = "https://www.voteit.se/"
#Documentation = "https://readthedocs.org"
Repository = "https://github.com/voteit/voteit.git"
Issues = "https://github.com/voteit/voteit/issues"
Changelog = "https://github.com/voteit/voteit/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
    "django-hijack (>=3.7.4,<4.0.0)",
    "ipython (>=9.6.0,<10.0.0)",
    "ruff (>=0.13.3,<0.14.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "coverage (>=7.10.7,<8.0.0)",
    "fakeredis (>=2.32.0,<3.0.0)",
    "personnummer (>=3.2.1,<4.0.0)",
    "responses (>=0.25.8,<0.26.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
]

docker = [
    "sentry-sdk (>=2.40.0,<3.0.0)",
    "slack-logger (>=0.3.1,<0.4.0)",
    "personnummer (>=3.2.1,<4.0.0)"
]

[tool.poetry]
exclude = [
    "**/tests/*"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.coverage.run]
command_line = "manage.py test voteit --keepdb"
source = ["voteit"]
omit = [
    "admin.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.ruff]
include = ["pyproject.toml", "voteit/**/*.py", "src/**/*.py"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "migrations"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
