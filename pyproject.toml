[project]
name = "voteit"
version = "0.1.dev"
description = "Decisions online or in general assemblies, realtime or async"
authors = [{ name = "VoteIT dev team", email = "info@voteit.se" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "AGPL" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "channels-envelope (>=1.1.0,<2.0.0)",
    "stvpoll (>=0.4.6,<0.5.0)",
    "rules (>=3.5,<4.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic[email] (<2)",
    "rq (>=2.6.0,<3.0.0)",
    "django-auditlog (>=3.3.0,<4.0.0)",
    "django-rq (>=3.1,<4.0)",
    "django-fsm-admin-django-4 (>=1.2.7,<2.0.0)",
    "django-fsm (<3)",
    "django-filter (>=25.2,<26.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django (>=5.2.7,<6.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "channels (>=4.3.1,<5.0.0)",
    "psycopg[binary,pool] (>=3.2.12,<4.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "nh3 (>=0.3.1,<0.4.0)",
    "social-auth-app-django (>=5.6.0,<6.0.0)",
    "django-sql-utils (>=0.7.0,<0.8.0)",
    "rq-scheduler (>=0.14.0,<0.15.0)",
    "python-graph-core (>=1.8.2,<2.0.0)",
    "setuptools (>=80.9.0,<81.0.0)",
    "django-controlcenter>=0.3.3",
    "py-vote-core>=2.0.0",
    "python-magic>=0.4.27",
    "djangorestframework-api-key>=3.1.0",
]

[project.urls]
Homepage = "https://www.voteit.se/"
Repository = "https://github.com/voteit/voteit.git"
Issues = "https://github.com/voteit/voteit/issues"
Changelog = "https://github.com/voteit/voteit/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["src/voteit_org", "src/member_dialects"]

[tool.uv.sources]
member_dialects = { workspace = true }
voteit_org = { workspace = true }
voteit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voteit"]
exclude = [
    "**/tests/**",
    "**/tests.py",
]

[tool.hatch.build.targets.sdist]
packages = ["voteit"]
exclude = [
    "**/tests/**",
    "**/tests.py",
]

[dependency-groups]
dev = [
    "django-hijack (>=3.7.4,<4.0.0)",
    "ipython (>=9.6.0,<10.0.0)",
    "ruff (>=0.13.3,<0.14.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "coverage (>=7.10.7,<8.0.0)",
    "fakeredis (>=2.32.0,<3.0.0)",
    "personnummer (>=3.2.1,<4.0.0)",
    "responses (>=0.25.8,<0.26.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "voteit-org>=1.0.0",
    "member-dialects>=1.0.0",
    "djangorestframework-stubs>=3.16.9",
]

docker = [
    "sentry-sdk (>=2.40.0,<3.0.0)",
    "slack-logger (>=0.3.1,<0.4.0)",
    "personnummer (>=3.2.1,<4.0.0)",
]


[tool.coverage.run]
command_line = "manage.py test voteit --keepdb"
source = ["voteit"]
omit = [
    "admin.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.ruff]
include = ["pyproject.toml", "voteit/**/*.py", "src/**/*.py"]
lint.isort.force-single-line = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "migrations"
]
