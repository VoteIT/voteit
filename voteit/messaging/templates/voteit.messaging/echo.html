<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Echo chamber</title>
</head>
<body>
    <p>Log</p>
    <textarea id="chat-log" cols="100" rows="20"></textarea><br>

    <hr/>


    <p>Payload, probably json:</p>
    <textarea id="message-input" cols="50" rows="5"></textarea><br>

    <p>Message type:</p>

    <!--
    <input id="t-input" type="text" size="10"><br>
    -->
    <select id="t-input">
    {% for type in message_types %}
        <option value="{{type}}">{{type}}</option>
    {% endfor %}
    </select>

    <p>
        <input id="message-submit" type="button" value="Send">
        <input id="reconnect" type="button" value="Reconnect">
    </p>

    <script>
        // const roomName = JSON.parse(document.getElementById('room-name').textContent);

        var chatSocket;

        function connect () {
            if (typeof chatSocket != "undefined") {
                chatSocket.close();
            }

            chatSocket = new WebSocket(
                'ws://'
                + window.location.host
                + '/ws/token/'
            );

            chatSocket.onmessage = function(e) {
                console.log(e);
                const data = JSON.parse(e.data);
                document.querySelector('#chat-log').value += (JSON.stringify(data.p) + '\n');
            };

            chatSocket.onclose = function(e) {
                console.error('Chat socket closed, code: ' + e.code);
            };

            document.querySelector('#message-input').focus();
            document.querySelector('#message-input').onkeyup = function(e) {
                if (e.keyCode === 13) {  // enter, return
                    document.querySelector('#chat-message-submit').click();
                }
            };

            document.querySelector('#reconnect').onclick = function(e) {
                console.log("Reconnecting...")
                connect();
            }

            document.querySelector('#message-submit').onclick = function(e) {
                const messageInputDom = document.querySelector('#message-input');
                const message = messageInputDom.value;


                const msg_id = Math.floor(Math.random() * 10000);
                console.log("Msg id: ", msg_id);
                chatSocket.send(JSON.stringify({
                    'p': message,
                    't': document.querySelector('#t-input').value,
                    'i': msg_id
                }));
                // messageInputDom.value = '';
            };

        }

        connect();

    </script>
</body>
</html>
