[metadata]
name = voteit
version = 0.1
description = VoteIT
long_description = file: README.md
url = https://www.voteit.se/
author = VoteIT dev team
author_email = info@voteit.se
license = GPLv3  # Example license

classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 3
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
install_requires =
    django < 4, >= 3
    rules
    markdown
    djangorestframework
    django-rest-framework-rules
    django-fsm
    django-fsm-admin
    django-rq
    rq-scheduler
    STVPoll
    channels>=3.0.0
    channels_redis
    pydantic

test_suite = tests
include_package_data = true
packages = find:


[options.extras_require]
testing =
    coverage>=5.0


[coverage:run]
source =
    voteit
omit =
    */tests/*
    */migrations/*

[coverage:report]

# Regexes for lines to exclude from consideration
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover

    # Don't complain about missing debug-only code or stuff that isn't required:
    if self\.debug
    def __repr__
    def __str__

    # Don't complain if tests don't hit defensive assertion code:
    raise AssertionError
    raise NotImplemented
    raise NotImplementedError

    # Or stuff that isn't runnable
    @abstractmethod
    if TYPE_CHECKING:

    # Don't complain if non-runnable code isn't run:
    if 0:
    if False:
    if __name__ == .__main__.:


# ignore_errors = True
show_missing = True
skip_covered = True
