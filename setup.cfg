[metadata]
name = voteit
version = 0.1
description = VoteIT
long_description = file: README.md
url = https://www.voteit.se/
author = VoteIT dev team
author_email = info@voteit.se
license = GPLv3  # Example license

classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 3
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
install_requires =
    channels
    channels_redis
    django < 6, > 5
    django-cors-headers
    djangorestframework < 4
    django-model-utils
    django-filter
    django-fsm<3
    django-fsm-admin-django-4
    django-rq >= 2.4.0, <3
    django-auditlog >= 3.2.1, <4
    rq >= 1.14, < 2
    pydantic[email] >= 1.10, <2
    pyyaml
    rules
    STVPoll >= 0.4.5
    bleach >= 6.0, < 7
    beautifulsoup4
    lxml
    python3-vote-core
    requests_oauthlib
    channels_envelope >= 1.1
    dj_dolly
    django-deep-collector


test_suite = tests
include_package_data = true
packages = find:


[options.extras_require]
testing =
    coverage>=5.0
    fakeredis
    personnummer
    responses
    python-json-logger

swedish_ssn =
    personnummer
