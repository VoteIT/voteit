name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - one_repo
    tags:
      - v*

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout / voteit_org
        uses: actions/checkout@v5
        with:
          repository: voteit/voteit_org
          path: src/voteit_org

      - name: Checkout / member_dialects
        uses: actions/checkout@v5
        with:
          repository: voteit/member_dialects
          path: src/member_dialects

      - name: Build wheels
        run: |
          pip install build
          python -m build -w .
          python -m build -w src/voteit_org -o dist
          python -m build -w src/member_dialects -o dist

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Manual or tagged
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
