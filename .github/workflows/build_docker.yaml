name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to full commit SHAs, not tags. A tag is mutable: whoever
# controls the action's repository can repoint v6 at a different commit, and
# every workflow that says @v6 runs it on the next push. That is how
# tj-actions/changed-files was used to dump runner secrets in March 2025.
# Dependabot (.github/dependabot.yml) keeps these SHAs current.
jobs:
  # Building the wheels means executing a build backend fetched from PyPI, so
  # this job gets no credentials worth stealing: contents:read only, no
  # packages:write, no id-token:write, and no token left behind in .git/config.
  wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default is true, which writes GITHUB_TOKEN into .git/config where
          # anything running later in the job can read it. Nothing here runs
          # git afterwards, so drop it.
          persist-credentials: false

      - name: Checkout / voteit_org
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: voteit/voteit_org
          path: src/voteit_org
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"

      - name: Build wheels
        run: uv build --all-packages --wheel -o ./dist

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # This job holds the registry credential, so nothing untrusted may run in it
  # before the push. It builds, scans, and only then logs in and pushes, so the
  # credential exists for two steps at the end and the scanner never shares a
  # job state with it. Dependency resolution happens inside the container,
  # which does not inherit the runner environment.
  docker:
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Trivy's findings are uploaded as SARIF to the Security tab. Free for
      # this repo because it is public; a private repo needs GitHub Advanced
      # Security, and without it the upload step fails.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout / voteit_org
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: voteit/voteit_org
          path: src/voteit_org
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: dist

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build without pushing, so the image can be scanned before it leaves the
      # runner. The image stays in the runner's docker daemon; the push step
      # further down sends the very bytes that were scanned, rather than
      # rebuilding them.
      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select image to scan
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(head -n 1 <<<"$TAGS")" >> "$GITHUB_OUTPUT"

      # Two passes over the same image, because they answer different
      # questions. This one reports: every fixable finding, at any severity,
      # goes to the Security tab so it is visible and tracked even when it is
      # not bad enough to stop a release. It must not fail the job, or the
      # upload below never runs.
      - name: Scan image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          # Unfixed CVEs in the Debian base are not actionable here -- there is
          # no version to upgrade to -- and they drown out what is. Rebuilds
          # pick them up as soon as Debian ships a fix, since the base image
          # digest is bumped by Dependabot.
          ignore-unfixed: true

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # And this one prints the HIGH/CRITICAL findings as a table in the job
      # log, where they are visible without opening the Security tab. It does
      # not fail the build: a fixable CVE in the base image is not something a
      # release here can fix, and blocking on it only stopped us from shipping
      # our own changes while we waited for an upstream rebuild.
      - name: Scan image with Trivy (log HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # Keep the login as late as possible: it writes the credential to
      # ~/.docker/config.json, where every later step can read it. Everything
      # above -- including the scanner, which is third-party code -- runs
      # before the job has a registry credential to leak.
      - name: Log in to the Container registry
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Manual or tagged
      - name: Push docker image
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
