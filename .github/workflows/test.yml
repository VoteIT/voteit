name: Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Pick voteit_org branch
      id: org_ref
      # Same branch name as this build if voteit_org has one, otherwise main.
      # head_ref is the PR source branch; ref_name covers pushes and tags.
      # Passed via env since branch names are untrusted input.
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        set +e
        git ls-remote --exit-code --heads https://github.com/voteit/voteit_org.git "refs/heads/$BRANCH" > /dev/null
        rc=$?
        set -e
        case $rc in
          0) ref="$BRANCH" ;;
          2) ref=main ;;
          *) echo "git ls-remote failed ($rc)"; exit 1 ;;
        esac
        echo "Using voteit_org@$ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Checkout / voteit_org
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: voteit/voteit_org
        ref: ${{ steps.org_ref.outputs.ref }}
        path: src/voteit_org
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.9"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --locked
        uv pip install --no-deps -e src/voteit_org

    - name: Django testrunner
      run: |
        uv run ./manage.py test voteit
      env:
        DJANGO_DEBUG: 1
        DJANGO_SETTINGS_MODULE: project.settings
        POSTGRES_HOST: 127.0.0.1
        ID_HOST: https://id.voteit.se
        OAUTHLIB_INSECURE_TRANSPORT: 1
        HOST: .voteit.se
        REDIS_CACHE_LOCATION: redis://127.0.0.1:6379/4
        REDIS_RQ_HOST: 127.0.0.1
        REDIS_CHANNEL_HOST: 127.0.0.1
        DJANGO_SECRET_KEY: very-secret
