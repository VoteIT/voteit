name: Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Checkout / voteit_org
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: voteit/voteit_org
        path: src/voteit_org
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.9"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --locked

    - name: Django testrunner
      run: |
        uv run ./manage.py test voteit
      env:
        DJANGO_DEBUG: 1
        DJANGO_SETTINGS_MODULE: project.settings
        POSTGRES_HOST: 127.0.0.1
        ID_HOST: https://id.voteit.se
        OAUTHLIB_INSECURE_TRANSPORT: 1
        HOST: .voteit.se
        REDIS_CACHE_LOCATION: redis://127.0.0.1:6379/4
        REDIS_RQ_HOST: 127.0.0.1
        REDIS_CHANNEL_HOST: 127.0.0.1
        DJANGO_SECRET_KEY: very-secret
