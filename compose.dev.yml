# Link this file as compose.override.yml to use Docker for development
services:
  django:
    build:
      dockerfile: ./dev.Dockerfile
    # The entrypoint's `run`, plus the reload watcher. Everything after `run` is
    # handed to uvicorn; --reload-dir is limited to the mounts below so watchfiles
    # does not walk /app/media.
    command: ["run", "--reload", "--reload-dir", "/app/voteit", "--reload-dir", "/app/project"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./voteit:/app/voteit:ro
      - ./project:/app/project:ro
      - ./src/dialect_configs/dialects:/app/dialects:ro
