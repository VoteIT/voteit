version: '3'

services:
  db:
    image: postgres:${POSTGRES_VERSION}
    #command: -c 'max_connections=300'
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./volumes/backup:/var/backup
    ports:
      - "5432:5432"
  redis:
    image: redis:7.0
    volumes:
      - ./volumes/redis:/data
    ports:
      - "6379:6379"
